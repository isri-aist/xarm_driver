# Runs `uri interface` with RobotDriverxArm.
#
# Usage:
#   docker compose up            # pulls the image published by CI
#   docker compose pull          # updates it to the latest main
#   docker compose up --build    # builds it locally instead
#
# Configuration files are read from ./etc by default and mounted read-only
# at /config.
#
# Override the directory or filename with:
#   URI_CONFIG_DIR=/path/to/configs
#   URI_CONFIG_FILE=xarm7.yaml
#
# Example:
#   URI_CONFIG_DIR=./etc \
#   URI_CONFIG_FILE=xarm7.yaml \
#   docker compose up

services:
  interface:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/isri-aist/unified_robot_interface:latest}
    image: ${XARM_DRIVER_IMAGE:-ghcr.io/isri-aist/xarm_driver:latest}
    # zenoh reaches the manager, and the driver reaches the UR controller (or
    # URSim's docker network), over the host network. The UR controller also
    # connects back to this host for the external-control script.
    network_mode: host
    # Needed by the zenoh/shm protocol (shared memory with the manager).
    ipc: host
    # `uri` has the cap_sys_nice file capability: exec fails without it.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    volumes:
      - ${URI_CONFIG_DIR:-./etc}:/config:ro
    command: ["uri", "interface", "-c", "/config/${URI_CONFIG_FILE:-robot_interface.yaml}"]
    stdin_open: true
    tty: true
    restart: "no"
